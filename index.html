<body>
  <main class="app-shell">
    <section class="map-stage">
      <iframe id="mapFrame" title="Current shop map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="map-overlay"></div>
      <button id="menuBtn" class="hamburger" aria-label="Open menu"><span></span><span></span><span></span></button>
      <div class="top-pill"><strong>York audit route</strong><span id="progressText">Stop 1 of 12</span></div>

    </section>
    <section id="bottomSheet" class="bottom-sheet">
      <div class="sheet-handle"></div><div class="swipe-hint">Swipe left to skip · swipe up for details</div><div id="nextStopCard" class="next-stop-card"></div><div id="detailPanel" class="detail-panel"></div>
    </section>
    <aside id="sideMenu" class="side-menu" aria-hidden="true">
      <div class="menu-head"><div><strong>Menu</strong><span>York route · v: 44</span></div><button id="closeMenu">×</button></div>
      <button data-section="route" class="menu-item active">Route</button><button data-section="shop" class="menu-item">Shop</button><button data-section="projects" class="menu-item">Projects</button><button data-section="money" class="menu-item">Money</button><button data-section="sync" class="menu-item">Team</button>
      <div id="menuContent" class="menu-content"></div>
    </aside>
    <div id="menuBackdrop" class="menu-backdrop"></div>

  <script src="voice-notes.js?v=44"></script>
